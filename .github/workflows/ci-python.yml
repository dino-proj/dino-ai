name: CI — Python SDK

on:
  push:
    branches: [main]
    paths:
      - "packages/dino-ai-py/**"
      - "catalog/**"
      - ".github/workflows/ci-python.yml"
  pull_request:
    branches: [main]
    paths:
      - "packages/dino-ai-py/**"
      - "catalog/**"
      - ".github/workflows/ci-python.yml"

defaults:
  run:
    working-directory: packages/dino-ai-py

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Generate models from catalog
        run: uv run python scripts/generate_models.py

      - name: Lint (ruff)
        run: uv run ruff check src/ tests/

      - name: Type check (mypy)
        run: uv run mypy src/dino_ai

      - name: Test (pytest)
        run: uv run pytest --tb=short

  build:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Copy README for packaging
        run: cp ../../README.md . && cp ../../README.en.md .

      - name: Build package
        run: uv build

      - name: Check package
        run: uv run twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: packages/dino-ai-py/dist/
