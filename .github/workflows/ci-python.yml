name: CI — Python SDK

on:
  push:
    branches: [main]
    paths:
      - "packages/dino-ai-py/**"
      - "catalog/**"
      - "Justfile"
      - ".github/workflows/ci-python.yml"
    tags:
      - "v*"
  pull_request:
    branches: [main]
    paths:
      - "packages/dino-ai-py/**"
      - "catalog/**"
      - "Justfile"
      - ".github/workflows/ci-python.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v6

      - uses: extractions/setup-just@v4

      - uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Check (install + lint + typecheck + test)
        run: just check

  build:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v6

      - uses: extractions/setup-just@v4

      - uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Build package
        run: just build

      - name: Check package
        run: cd packages/dino-ai-py && uv run twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: packages/dino-ai-py/dist/

  publish:
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
